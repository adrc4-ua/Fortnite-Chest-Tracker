name: Etiquetado automático de incidencias

on:
  issues:
    types: [opened, edited, closed, reopened]

jobs:
  auto-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Gestionar etiquetas según el formulario y estado
        uses: actions/github-script@v7
        with:
          script: |
            const action = context.payload.action;
            const issueNumber = context.payload.issue.number;
            const currentLabels = (context.payload.issue.labels || []).map(l => l.name);

            // 1. Manejo del ciclo de vida de cierre / reapertura
            if (action === 'closed') {
              // Al cerrar: quitar 'triaje' y 'en progreso', añadir 'resuelto'
              if (currentLabels.includes('triaje')) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: 'triaje'
                }).catch(() => {});
              }
              if (currentLabels.includes('en progreso')) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: 'en progreso'
                }).catch(() => {});
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['resuelto']
              });
              console.log('Incidencia cerrada: marcada como resuelto');
              return;
            }

            if (action === 'reopened') {
              // Al reabrir: quitar 'resuelto', añadir 'triaje'
              if (currentLabels.includes('resuelto')) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: 'resuelto'
                }).catch(() => {});
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['triaje']
              });
              console.log('Incidencia reabierta: vuelta a triaje');
              return;
            }

            // 2. Al abrir o editar: clasificar tipo y área desde el formulario
            const body = context.payload.issue.body || '';
            const labelsToAdd = new Set();

            // Solo añadir 'triaje' si no está ya 'en progreso' ni 'resuelto'
            if (!currentLabels.includes('en progreso') && !currentLabels.includes('resuelto')) {
              labelsToAdd.add('triaje');
            }

            // Tipo de solicitud
            if (/Problema o fallo|Bug report/i.test(body)) {
              labelsToAdd.add('problema');
            } else if (/Sugerencia o mejora|Suggestion or enhancement/i.test(body)) {
              labelsToAdd.add('mejora');
            } else if (/Petición o duda|Question or request/i.test(body)) {
              labelsToAdd.add('pregunta');
            }

            // Área o componente
            if (/Overlay en el juego|In-game overlay/i.test(body)) {
              labelsToAdd.add('área: overlay');
            }
            if (/Ventana principal|Desktop application window/i.test(body)) {
              labelsToAdd.add('área: ventana');
            }
            if (/Estadísticas web|Web stats page/i.test(body)) {
              labelsToAdd.add('área: estadísticas');
            }
            if (/Lectura de partidas|Replay parsing/i.test(body)) {
              labelsToAdd.add('área: replays');
            }
            if (/Caza de tesoros|Weekly prizes/i.test(body)) {
              labelsToAdd.add('área: tesoros');
            }
            if (/Configuración, arranque u OBS|Settings, autostart, or OBS/i.test(body)) {
              labelsToAdd.add('área: configuración');
            }
            if (/Otro|Other/i.test(body)) {
              labelsToAdd.add('área: otro');
            }

            if (labelsToAdd.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: Array.from(labelsToAdd)
              });
              console.log('Etiquetas aplicadas con éxito:', Array.from(labelsToAdd));
            }
