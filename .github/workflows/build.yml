name: Build FCT.exe
# Pushes (branches and v* tags) only build the exe, as an artifact: tags never create releases.
# Releases are made by hand on GitHub. FCT.exe is attached to a release:
#  - by itself when the release is published, if its tag already has this workflow;
#  - by hand for any tag: Actions → "Build FCT.exe" → Run workflow → write the tag (e.g. v5.7.0). The workflow of the
#    branch you run it from (main) is used, so this also works for tags made before this file existed.
on:
  push:
    branches: ['**']
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach FCT.exe to (e.g. v5.7.0). Empty: only build.'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      # Code signing with SignPath (free for open source, see CODE_SIGNING_POLICY.md). It only runs for release builds
      # (a published release, "Run workflow" with a tag, or a v* tag) and once SignPath is set up: repository secret
      # SIGNPATH_API_TOKEN and repository variable SIGNPATH_ORGANIZATION_ID (Settings → Secrets and variables →
      # Actions). Until then the exe is built unsigned, as before.
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && (github.event_name == 'release' || inputs.tag != '' || github.ref_type == 'tag') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        shell: pwsh
        env:
          BUILD_TAG: ${{ inputs.tag != '' && inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
          # fortnite-api.com key (repository secret FORTNITE_API_KEY): lets the app look up the player's total matches.
          # Without the secret the build still works and the player types the number.
          FORTNITE_API_KEY: ${{ secrets.FORTNITE_API_KEY }}
        run: |
          # The project file moved over time; older tags still have it in one of the earlier places.
          $project = @('src/FCT.csproj', 'src/FCT/FCT.csproj') | Where-Object { Test-Path $_ } | Select-Object -First 1
          $versionArgs = @()
          if ($env:BUILD_TAG -match '^v(\d+\.\d+\.\d+)$') {
            $versionArgs += "-p:Version=$($Matches[1])"
          }
          dotnet publish $project -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none @versionArgs -o dist
          if (-not (Test-Path dist/FCT.exe)) { Get-ChildItem dist/*.exe | Select-Object -First 1 | Rename-Item -NewName FCT.exe }

      # ---- Signing (only when SIGN is true) -------------------------------------------------------------------------
      # SignPath takes the exe as a GitHub artifact (its artifact configuration is in .signpath/artifact-configuration.xml),
      # waits for the approval on SignPath and returns it signed. The project and signing policy slugs can be changed
      # with the repository variables SIGNPATH_PROJECT_SLUG and SIGNPATH_SIGNING_POLICY_SLUG.
      - name: Upload the unsigned exe for SignPath
        id: unsigned
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FCT-unsigned
          path: dist/FCT.exe
      - name: Sign with SignPath
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Fortnite-Chest-Tracker' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Each request is approved by hand on SignPath: give it time.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Use the signed exe
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed -Recurse -Filter FCT.exe | Select-Object -First 1
          if (-not $signed) {
            # Some versions hand back the zip itself.
            Get-ChildItem signed -Recurse -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath signed/unzipped -Force }
            $signed = Get-ChildItem signed -Recurse -Filter FCT.exe | Select-Object -First 1
          }
          if (-not $signed) { throw 'SignPath did not return FCT.exe' }
          $signature = Get-AuthenticodeSignature $signed.FullName
          if ($signature.Status -ne 'Valid') { throw "The returned FCT.exe is not validly signed: $($signature.Status)" }
          Copy-Item $signed.FullName dist/FCT.exe -Force
          Write-Host "Signed by: $($signature.SignerCertificate.Subject)"

      - uses: actions/upload-artifact@v4
        with:
          name: FCT
          path: dist/FCT.exe

  # Attaches the exe to the release (published by hand, or the tag given to "Run workflow").
  #
  # GITHUB_TOKEN can only write here if Settings → Actions → General → Workflow permissions allows it ("Read and
  # write permissions"); the `permissions: contents: write` below cannot raise that limit. Otherwise add a repository
  # secret RELEASE_TOKEN (Settings → Secrets and variables → Actions) with a token that can write this repo's
  # contents: it is used instead of the default token.
  attach:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FCT
          path: dist
      - name: Attach FCT.exe to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG" dist/FCT.exe --clobber --repo "$GITHUB_REPOSITORY"
      # SignPath Foundation asks for the code signing policy on the download page: added once to the release notes.
      - name: Add the code signing policy to the release notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)"
          if ! grep -q "Code signing policy" <<< "$body"; then
            note="Free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/) · [Code signing policy](https://github.com/$GITHUB_REPOSITORY/blob/main/CODE_SIGNING_POLICY.md) · [Third-party notices](https://github.com/$GITHUB_REPOSITORY/blob/main/THIRD_PARTY_NOTICES.md) · Not affiliated with Epic Games."
            printf '%s\n\n---\n%s\n' "$body" "$note" > notes.md
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          fi
