name: "Problema, sugerencia o petición"
description: "Informa de un problema, propón una mejora o solicita una función para FCT"
body:
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de solicitud
      description: Selecciona el motivo de este reporte.
      options:
        - "🐛 Problema o fallo"
        - "💡 Sugerencia o mejora"
        - "❓ Petición o duda"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Área o componente
      description: ¿Con qué parte de FCT se relaciona?
      options:
        - "Overlay en el juego"
        - "Ventana principal"
        - "Estadísticas web (página local)"
        - "Lectura de partidas y cofres"
        - "Caza de tesoros y premios semanales"
        - "Configuración, arranque u OBS"
        - "Otro"
    validations:
      required: true

  - type: textarea
    id: descripcion
    attributes:
      label: Descripción detallada
      description: Explica lo ocurrido o la mejora que propones. *(Se asume la última versión de FCT y de Fortnite; si usas una anterior, indícala aquí)*.
      placeholder: Describe aquí los detalles de lo sucedido o tu propuesta...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Registro de errores (errors.log)
      description: Si hubo un error o cierre, adjunta o pega el contenido de `%APPDATA%\FCT\errors.log` (pulsa `Win + R` y escribe `%APPDATA%\FCT`). Tu usuario de Windows se oculta automáticamente.
      placeholder: Pega aquí el contenido de errors.log (o arrastra y suelta el archivo)...
    validations:
      required: false
