name: "Problem, suggestion, or request"
description: "Report a bug, propose an enhancement, or ask a question about FCT"
labels: ["triaje"]
body:
  - type: dropdown
    id: request_type
    attributes:
      label: Request type
      description: Select the main reason for this report.
      options:
        - "Bug report"
        - "Suggestion or enhancement"
        - "Question or request"
    validations:
      required: true

  - type: dropdown
    id: affected_area
    attributes:
      label: Affected area or component
      description: What part of FCT is this related to?
      options:
        - "In-game overlay"
        - "Desktop application window"
        - "Web stats page (local)"
        - "Replay parsing & chest counting"
        - "Weekly prizes & treasure hunt"
        - "Settings, autostart, or OBS"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Detailed description
      description: Explain what happened or the enhancement you propose. *(Assumed latest version of FCT and Fortnite; if running an older version, please specify it here)*.
      placeholder: Describe what happened or your suggestion here...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error log (errors.log)
      description: If you experienced an error or crash, attach or paste `%APPDATA%\FCT\errors.log` (press `Win + R` and enter `%APPDATA%\FCT`). Your Windows username is automatically masked.
      placeholder: Paste contents of errors.log here (or drag and drop the file)...
    validations:
      required: false
